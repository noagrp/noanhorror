name: Prepare fixed Noan narrator

on:
  push:
    paths:
      - '.github/workflows/prepare-noan-narrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert CC0 voice for browser
        run: |
          set -euo pipefail
          entry=$(unzip -Z1 voice/am_granite.pt | grep '/data/0$' | head -n1)
          test -n "$entry"
          unzip -p voice/am_granite.pt "$entry" > voice/am_granite.bin
          size=$(wc -c < voice/am_granite.bin)
          echo "browser voice bytes: $size"
          test "$size" -gt 500000
      - name: Wire narrator before app script
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='    <script src="narrator.js?v=1"></script>\n'
          if tag.strip() not in s:
              marker='    <script>\n'
              if marker not in s:
                  marker='    <script>\r\n'
              s=s.replace(marker,tag+marker,1)
              p.write_text(s)
          PY
      - name: Commit browser voice and wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice/am_granite.bin index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use fixed Kokoro narrator voice"
          git push
