name: Apply Noan Horror design refinement

on:
  push:
    paths:
      - '.github/workflows/apply-design-refinement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          head='''    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">\n    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">\n    <link rel="manifest" href="manifest.webmanifest?v=1">\n    <meta name="theme-color" content="#020204">\n    <link rel="stylesheet" href="design.css?v=1">\n'''
          if 'manifest.webmanifest?v=1' not in s:
              s=s.replace('    <title>Noan\'s Favorite Stories</title>\n', '    <title>Noan\'s Favorite Stories</title>\n'+head, 1)
          old='Disclaimer: All stories are fictional. For the best experience, read on a computer. You may need to Install Voice Data (download a high-quality or "Enhanced" voice pack) on a phone.'
          s=s.replace(old,'All stories are fictional.')
          reg='''\n    <script>\n      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./service-worker.js?v=1').catch(()=>{}); }\n    </script>\n'''
          if 'service-worker.js?v=1' not in s:
              s=s.replace('</body>',reg+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine Noan Horror design and PWA wiring"
          git push
