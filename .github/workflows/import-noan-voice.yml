name: Import Noan narrator voice

on:
  push:
    paths:
      - '.github/workflows/import-noan-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 narrator assets
        run: |
          set -euo pipefail
          mkdir -p voice
          curl -fL --retry 3 -o voice/am_granite.pt \
            https://raw.githubusercontent.com/n33kos/kokoro-voices/main/voices/am_granite.pt
          curl -fL --retry 3 -o voice/am_granite.wav \
            https://raw.githubusercontent.com/n33kos/kokoro-voices/main/samples/am_granite.wav
          curl -fL --retry 3 -o voice/CC0_LICENSE.txt \
            https://raw.githubusercontent.com/n33kos/kokoro-voices/main/LICENSE
          cat > voice/README.md <<'EOF'
          # Noan narrator voice

          `am_granite.pt` and its sample were copied from `n33kos/kokoro-voices`.

          The source repository releases these community voice files under CC0 1.0 Universal. The included `CC0_LICENSE.txt` is a copy of the source license.

          Source: https://github.com/n33kos/kokoro-voices
          Voice: `am_granite` — low, slow and deliberate.

          Kokoro itself is separately licensed and is not included by this import.
          EOF

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice/am_granite.pt voice/am_granite.wav voice/CC0_LICENSE.txt voice/README.md
          if git diff --cached --quiet; then
            echo "Voice assets already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add CC0 am_granite narrator voice"
          git push
