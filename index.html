<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noan's Favorite Stories // Enter</title>
    <style>
        /* Base Pure Dark Atmosphere */
        body {
            background-color: #020204 !important;
            color: #ffffff !important;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            max-width: 100vw; /* Locks horizontal boundaries strictly to the device hardware */
            contain: paint;   /* Prevents floating entities from pulling or expanding the layout */
            /* Mobile-Safe Viewport calculation framework */
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column; /* Clean vertical stacked grouping */
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            height: -webkit-fill-available;
        }

        /* Fixed Audio Panel - Locked to Top Right Permanently */
        .audio-controls {
            position: fixed;
            top: 20px !important;
            right: 20px !important;
            bottom: auto !important;
            left: auto !important;
            z-index: 30; /* Increased z-index to stay unconditionally above all UI elements */
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            color: #444444 !important;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            padding: 0;
            margin: 0;
            -webkit-appearance: none;
            appearance: none;
        }
        .control-btn:hover {
            color: #7f1d1d !important;
        }
        .control-btn.muted {
            color: #1a1a1a !important;
        }

        /* Responsive Glassmorphism Story Box Container (No Border) */
        .card-container {
            position: relative;
            z-index: 5; 
            max-width: 550px;
            width: 85%;
            text-align: center;
            box-sizing: border-box;
            padding: 40px 30px;
            border-radius: 16px;
            transition: all 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Safe Height boundaries preventing viewport breakage on short devices */
            max-height: 80vh;
            
            /* Glassmorphism Effect Rules */
            background: rgba(255, 255, 255, 0.02) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            
            border: none !important;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8) !important;
        }

        /* Menu State: Forces perfect vertical/horizontal fullscreen centering for the Enter word */
        .card-container.is-menu-state {
            max-width: 100% !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            padding: 0;
        }

        /* Full Word Shaking Structure Base */
        .word-shiver {
            display: inline-block;
            white-space: pre; 
            animation: wordTremble 0.22s infinite alternate ease-in-out;
        }

        @keyframes wordTremble {
            0% { transform: translate(0.4px, 0.2px) rotate(0deg); }
            50% { transform: translate(-0.2px, -0.3px) rotate(-0.1deg); }
            100% { transform: translate(0.3px, -0.2px) rotate(0.1deg); }
        }

        #story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            min-height: 140px;
            
            /* Dynamic height balancing for ultra short or cramped phone displays */
            max-height: 50vh; 
            overflow-y: auto; 
            scrollbar-width: none; /* Hides scrollbar for Firefox */
            width: 100%;
            display: block; 
            text-align: justify;
            text-justify: inter-word;
            color: #e5e7eb !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            margin: 0;
            padding: 0;
            transition: font-size 0.3s ease;
        }

        /* Hide scrollbars completely for Chrome, Safari, Opera */
        #story-text::-webkit-scrollbar {
            display: none;
        }

        /* Center alignments explicitly on the initial Menu view screen layout */
        #story-text.menu-centered {
            text-align: center !important;
            font-size: 2.5rem !important; /* Desktop Title Font Size */
            letter-spacing: 4px;
            color: #ffffff !important;
            max-height: none !important;
            overflow-y: visible !important;
        }

        /* Glassmorphic Action Button Configuration (No Border) */
        .next-btn {
            display: inline-block;
            margin-top: 35px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            padding: 12px 28px;
            border-radius: 8px;
            color: #ffffff !important;
            flex-shrink: 0; /* Prevents button from collapsing on tiny screens */
            
            background: rgba(153, 27, 27, 0.15) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: none !important; 
            outline: none !important;
            box-shadow: none !important;
            
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .next-btn:hover {
            background: rgba(239, 68, 68, 0.3) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2) !important;
        }

        /* Highly Recognizable Floating Background Ghosts */
        .bg-ghost {
            position: absolute;
            z-index: 1;
            cursor: pointer;
            filter: blur(2px);
            animation: floatAndFade 10s ease-in-out forwards;
        }

        /* Ghost Inner container element allows scale flipping over animation space paths */
        .bg-ghost-body {
            display: inline-block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
            transform: var(--base-flip);
        }

        @keyframes floatAndFade {
            0% { opacity: 0; transform: translate(0, 0) scale(0.7); }
            25% { opacity: var(--target-opacity); }
            75% { opacity: var(--target-opacity); }
            100% { opacity: 0; transform: translate(var(--x-drift), var(--y-drift)) scale(1.1); }
        }

        .bg-ghost.fly-away .bg-ghost-body {
            transform: translateY(-350px) scale(0.1) rotate(60deg) !important;
            opacity: 0 !important;
        }

        /* Atmospheric Disclaimer Header Style Configuration - Moved Safely to Top */
        .site-footer {
            position: absolute;
            top: 20px; /* Aligned horizontally clear of the main layout vectors */
            left: 20px;
            max-width: calc(100% - 160px); /* Strictly safeguards button clearance zones */
            text-align: left;
            z-index: 10;
            font-family: monospace;
            font-size: 0.65rem;
            color: #2a2a2a;
            letter-spacing: 1px;
            line-height: 1.5;
            box-sizing: border-box;
            transition: color 0.5s ease;
        }
        .site-footer.active-state {
            color: #444444; /* Lights up slightly once the user explicitly enters the core view state */
        }

        /* Mobile and Landscape Short Screen Optimizations */
        @media (max-width: 580px), (max-height: 600px) {
            .audio-controls {
                top: 12px !important;
                right: 12px !important;
            }
            .site-footer {
                top: 12px;
                left: 12px;
                max-width: calc(100% - 110px); /* Keeps text from backing into mobile audio rows */
                font-size: 0.55rem;
                line-height: 1.3;
            }
            .card-container {
                padding: 25px 20px;
                width: 90%;
                max-height: 70vh;
                margin-top: 60px; /* Clear safety margin down from top header elements */
                margin-bottom: 20px; 
            }
            .card-container.is-menu-state {
                width: 100vw !important;
                height: 100vh !important;
                max-height: 100vh !important;
                margin-top: 0px;
                margin-bottom: 0px;
            }
            #story-text {
                font-size: 1.1rem;
                min-height: 120px;
                max-height: 40vh;
            }
            #story-text.menu-centered {
                font-size: 2.2rem !important; /* Mobile Title Font Size */
            }
            .next-btn {
                width: 100%;
                box-sizing: border-box;
                margin-top: 20px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="audio-controls">
        <button id="voice-btn" class="control-btn" onclick="toggleVoiceEngine()">VOICE: ON</button>
    </div>

    <!-- Atmospheric Disclaimer Header Row Node -->
    <header id="app-footer" class="site-footer">
        DISCLAIMER: ALL STORIES ARE FICTIONAL. FOR THE BEST EXPERIENCE, READ ON A PC.
    </header>

    <!-- Main Glassmorphism Framework Interface Box (Starts in Fullscreen Centered Menu State) -->
    <div id="main-frame-box" class="card-container is-menu-state" style="cursor: pointer;" onclick="enterTheHorror()">
        <!-- Title & Story Container Element Node -->
        <div id="story-text" class="menu-centered">Enter</div>
        
        <!-- Action Button Element Node -->
        <button id="action-trigger" class="next-btn" style="display: none;" onclick="showRandomStory(event)">Read Another</button>
    </div>

    <script>
        // Token Key map architecture with fully mapped logical emotional variables:
        // [T] = Story Teller (Female Voice Profile)
        // [A-NORMAL] = Ben (Male Voice, Base Metrics)
        // [A-SCARED] = Ben (Male Voice, Shrill Pitch, Rapid Delivery)
        // [A-CURIOUS] = Ben (Male Voice, Hesitant Tone, Drawn Out Intervals)
        // [A-SCREAM] = Ben (Male Voice, Maximum Structural Pitch Level, Urgent Rate)
        // [A-PAIN] = Ben (Male Voice, Low Distorted Pitch, Fragmented Delivery)
        // [A-SAD] = Ben (Male Voice, Deep Lowered Pitch, Very Slow Depressed Rate)
        // [A-HAPPY] = Ben (Male Voice, Elevated Bright Pitch, Rhythmic Fast Tempo)
        // [S] = Sound Effects (Web Audio API Synthesized MIDI Generation Engine)
        const ghostStories = [
            [
                "[T] The floorboards of Blackwood Manor groaned beneath Ben's weight, bleeding out ancient dust into the freezing twilight air. He gripped his failing flashlight tightly, tracing the strange symbols carved directly into the rotten wood frames.",
                "[S] Creak... snap... creak...",
                "[A-NORMAL] This layout matches the blueprint exactly. The hidden ledger should be right behind the mantlepiece.",
                "[T] The sound came from upstairs. A rhythmic dragging weight, scraping right above his skull. Ben stopped breathing, freezing in absolute paralysis as he turned his face slowly toward the ceiling.",
                "[A-CURIOUS] Is anyone up there? I... I told you, I brought the keys... just let me leave with the documents...",
                "[S] Tak... tak... tak...",
                "[T] Sharp footsteps echoed clearly now, coming down the spiral staircase. The shadows stretched impossibly long across the wallpaper. Suddenly, a wet, freezing hand locked firmly around Ben's ankle from under the steps.",
                "[A-SCREAM] Help! Someone answer me! Get off me! Please, let me go!",
                "[S] Shhhhiiiiiiwrrrrrrk...",
                "[T] Sharp claws tore into his calf muscle as he was dragged violently down into the pitch-black basement cavity.",
                "[A-PAIN] Ah! My leg! It's cutting right through the bone! Stop... please...",
                "[T] The flashlight dropped, shattering completely on the floorboards. In the absolute dark, a lady's weeping laughter drifted close to his ear, signaling that the door behind him was locked forever."
            ],
            [
                "[T] The safehouse barriers were buckling under the weight of the decaying horde outside. Red emergency alarms painted the concrete bunker in rhythmic, blinding pulses of crimson light.",
                "[A-NORMAL] The structural integrity is holding at forty percent. We still have a window to broadcast the coordinates.",
                "[S] Thud... thud... crash...",
                "[T] Outside, the distorted wails of a hundred monsters scraped against the blast shield. Ben noticed a dark liquid oozing through the upper ventilator grille.",
                "[A-CURIOUS] Wait... what is that smell? That's not fuel oil... that's rot. How did they get up to the ventilation line?",
                "[S] Bzzzzzzt... pop... bzzzz...",
                "[T] The overhead lights flickered once, twice, and then completely died. The mechanical locks on the main vault doors clicked open with a heavy pneumatic sigh.",
                "[A-SCARED] No, no, no! The relay grid is fried! Lock it down manually! Get back from the threshold!",
                "[S] Growl... crunch... tear...",
                "[T] The reinforced iron mesh split apart. Shambling figures dropped from the ceiling, landing squarely on Ben's shoulders and clamping their teeth into his collarbone.",
                "[A-SCREAM] They are breaking through! Grace, hit the self destruct switch! Help me!",
                "[A-PAIN] No... no... they are ripping my shoulder apart... everything is burning...",
                "[T] The sound of tearing metal erupted in the dark, followed immediately by heavy, shambling footsteps pouring inside. Ben felt cold teeth scrape across his neck as the transmission went permanently silent."
            ],
            [
                "[T] Rain lashed violently against the glass window panes of the cabin where Ben stood trembling, holding a blood-slicked kitchen knife over the chest of the silent intruder.",
                "[S] Drip... drop... drip...",
                "[A-NORMAL] It is completely over now. The perimeter is quiet. No one is coming down this road in a storm like this.",
                "[T] He looked down at the pale face on the floor. The town police had spent weeks hunting for the serial killer stalking the local valley, warning everyone to lock their windows securely.",
                "[A-CURIOUS] I had no choice... he broke through the back entrance... he was going to kill me, right? I survived...",
                "[S] Tick... tock... tick...",
                "[T] Ben stepped back to catch his breath, caught by his own image reflection in the wall mirror. He looked at the intricately carved wooden frame, then down at the victim. The victim's hands were bound completely with thick ropes from behind before the stabbing began.",
                "[A-SCARED] Wait... if he was the intruder... why did I find the ropes in my own drawer? Why did I lock him in?",
                "[S] Hahahaha... hahahaha...",
                "[T] He wiped the blood from his own cheek, realizing the truth as his mind fractured completely. There was no break-in. Ben stared down at his reflection's hollow, unblinking eyes, realizing he was the monster the town had been praying to catch."
            ],
            [
                "[T] The morning sun pierced beautifully through the alpine canopy, casting golden beams over the clearing. Ben checked his radio, a massive grin breaking across his face as the signal meter jumped to full strength.",
                "[A-HAPPY] Yes! The connection went through! The search team just cleared the northern ridge! We are finally going home!",
                "[S] Pop... bzzzz... click...",
                "[T] He turned around to share the joyful news with his survival partner, but his foot caught on a jagged copper snare hidden beneath the fallen leaves. The steel jaws snapped shut with terrifying velocity.",
                "[S] Snap... crunch...",
                "[A-PAIN] Ahhh! My ankle! It's clamped clean through! The steel is biting into the nerve... I can't move!",
                "[T] He dragged his bleeding limb toward the edge of the ravine, desperately searching for the supply pack containing the medical splints. He looked over the ridge, only to see their entire equipment crate smashed to splinters at the bottom of the rocky canyon.",
                "[A-SAD] No... everything is gone. The medical kit, the supplies, the clean water... it's all destroyed. We survived two weeks out here just to bleed out on the final day...",
                "[S] Thud... thud... thud...",
                "[T] Shadows detached themselves from the deeper thicket as the smell of fresh blood drifted into the wilderness. Ben looked up, his voice cracking into absolute desperation.",
                "[A-SCREAM] I'm over here! Please! Follow the signal! Help me before they close the gap!"
            ]
        ];

        let unreadStories = [];
        let isVoiceEnabled = true;
        let hasEntered = false;
        
        // Single Shared Global Audio Context for synthesis processing
        let audioCtx = null;

        // Optimized Multi-Paragraph Word-by-Word Text Animator (Cleans out voice processing tags before rendering to user screen view)
        function renderAnimatedText(targetStoryArray, alignJustify = false) {
            const container = document.getElementById('story-text');
            container.innerHTML = ""; 
            
            if (alignJustify) {
                container.classList.remove('menu-centered');
            } else {
                container.classList.add('menu-centered');
            }

            targetStoryArray.forEach((rawLine, pIndex) => {
                // Strip out data management tokens via generic regular expression parsing logic
                const displayLine = rawLine.replace(/^\[[A-Z\-]+\]\s*/, '');
                
                const pElement = document.createElement('p');
                pElement.style.margin = "0 0 1.5rem 0"; 
                if (pIndex === targetStoryArray.length - 1) pElement.style.margin = "0"; 
                
                const words = displayLine.split(' ');

                words.forEach((word, index) => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = word;
                    wordSpan.classList.add('word-shiver');
                    wordSpan.style.animationDelay = `${Math.random() * 0.4}s`;
                    pElement.appendChild(wordSpan);

                    if (index < words.length - 1) {
                        const space = document.createTextNode(" ");
                        pElement.appendChild(space);
                    }
                });

                container.appendChild(pElement);
            });
            
            container.scrollTop = 0;
        }

        function enterTheHorror() {
            if (hasEntered) return;
            hasEntered = true;
            
            // Initialize Audio Context safely following user gesture guidelines
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const mainBox = document.getElementById('main-frame-box');
            mainBox.style.cursor = "default";
            mainBox.removeAttribute('onclick');
            
            mainBox.classList.remove('is-menu-state');
            
            // Activate disclaimer header text layout brightness index
            document.getElementById('app-footer').classList.add('active-state');
            
            document.getElementById('action-trigger').style.display = "inline-block";
            showRandomStory();
        }

        function showRandomStory(event) {
            if (event) event.stopPropagation();

            window.speechSynthesis.cancel();
            
            const actionBtn = document.getElementById('action-trigger');

            if (unreadStories.length === 0) {
                unreadStories = [...ghostStories]; 
                actionBtn.innerText = "Read Another";
            }

            const randomIndex = Math.floor(Math.random() * unreadStories.length);
            const chosenStoryArray = unreadStories.splice(randomIndex, 1)[0];

            renderAnimatedText(chosenStoryArray, true);
            
            if (unreadStories.length === 0) {
                actionBtn.innerText = "Read";
            }
            
            if (isVoiceEnabled) {
                speakSequentialStory(chosenStoryArray, 0);
            }
        }

        // Low-Fi Retro MIDI/Synth Sound Effects Engine via Web Audio API
        function playMidiSoundEffect(sfxText, callback) {
            if (!isVoiceEnabled || !audioCtx) {
                if (callback) callback();
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const cleaned = sfxText.toLowerCase().replace(/[^a-z. ]/g, '');
            const beats = cleaned.split(/\s+|\.\.\.+/).filter(b => b.trim().length > 0);
            
            let startTime = audioCtx.currentTime + 0.05;
            const beatDuration = 0.35; 

            beats.forEach((beat) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                let frequency = 90; 
                let type = 'square'; 
                let duration = 0.15;

                if (beat.includes('tak') || beat.includes('tick') || beat.includes('tock') || beat.includes('snap')) {
                    frequency = beat.includes('tick') ? 180 : 110;
                    type = 'square';
                    duration = 0.04; 
                } else if (beat.includes('creak') || beat.includes('shhh') || beat.includes('shwrrk')) {
                    frequency = 75;
                    type = 'sawtooth';
                    duration = 0.3; 
                } else if (beat.includes('thud') || beat.includes('crash') || beat.includes('growl') || beat.includes('crunch') || beat.includes('tear')) {
                    frequency = 55; 
                    type = 'sawtooth';
                    duration = 0.25;
                } else if (beat.includes('bzzz') || beat.includes('pop')) {
                    frequency = 130;
                    type = 'triangle';
                    duration = 0.2;
                } else if (beat.includes('hahaha')) {
                    frequency = 65;
                    type = 'sawtooth';
                    duration = 0.12;
                }

                osc.type = type;
                osc.frequency.setValueAtTime(frequency, startTime);
                
                if (type === 'sawtooth') {
                    osc.frequency.exponentialRampToValueAtTime(frequency - 20, startTime + duration);
                }

                gainNode.gain.setValueAtTime(0.12, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                osc.start(startTime);
                osc.stop(startTime + duration);

                startTime += beatDuration;
            });

            const totalDurationMs = ((startTime - audioCtx.currentTime) * 1000) + 100;
            setTimeout(() => {
                if (callback) callback();
            }, totalDurationMs);
        }

        // Multi-Voice Sequence Processor Engine with Full Emotional Profile Parameters
        function speakSequentialStory(storyArray, currentLineIndex) {
            if (!isVoiceEnabled || currentLineIndex >= storyArray.length) return;

            const rawLine = storyArray[currentLineIndex];
            
            // Structural emotional variant token tracking assignments
            const isTeller = rawLine.startsWith("[T]");
            const isNormal = rawLine.startsWith("[A-NORMAL]");
            const isScared = rawLine.startsWith("[A-SCARED]");
            const isCurios = rawLine.startsWith("[A-CURIOUS]");
            const isScream = rawLine.startsWith("[A-SCREAM]");
            const isPain = rawLine.startsWith("[A-PAIN]");
            const isSad = rawLine.startsWith("[A-SAD]");
            const isHappy = rawLine.startsWith("[A-HAPPY]");
            const isSFX = rawLine.startsWith("[S]");
            
            const cleanText = rawLine.replace(/^\[[A-Z\-]+\]\s*/, '');

            if (isSFX) {
                playMidiSoundEffect(cleanText, () => {
                    speakSequentialStory(storyArray, currentLineIndex + 1);
                });
                return;
            }

            const utterance = new SpeechSynthesisUtterance(cleanText);
            const voices = window.speechSynthesis.getVoices();

            // Setup granular character modulation matrix mappings
            if (voices.length > 0) {
                if (isTeller) {
                    const femaleVoice = voices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('google uk english female') || v.name.toLowerCase().includes('hazel'));
                    if (femaleVoice) utterance.voice = femaleVoice;
                    utterance.pitch = 0.95;
                    utterance.rate = 0.75;
                } else {
                    const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('google uk english male') || v.name.toLowerCase().includes('ravi'));
                    if (maleVoice) utterance.voice = maleVoice;
                    
                    if (isNormal) {
                        utterance.pitch = 0.65;
                        utterance.rate = 0.82;
                    } else if (isCurios) {
                        utterance.pitch = 0.78; 
                        utterance.rate = 0.68;  
                    } else if (isScared) {
                        utterance.pitch = 1.15; 
                        utterance.rate = 1.12;  
                    } else if (isScream) {
                        utterance.pitch = 1.45; 
                        utterance.rate = 1.25;  
                    } else if (isPain) {
                        utterance.pitch = 0.45; 
                        utterance.rate = 0.55;  
                    } else if (isSad) {
                        utterance.pitch = 0.35; 
                        utterance.rate = 0.50;  
                    } else if (isHappy) {
                        utterance.pitch = 0.90; 
                        utterance.rate = 0.95;  
                    }
                }
            } else {
                // System fallback loops when local voice profiles return empty vectors
                if (isTeller) { utterance.pitch = 1.1; utterance.rate = 0.8; }
                else if (isNormal) { utterance.pitch = 0.7; utterance.rate = 0.85; }
                else if (isCurios) { utterance.pitch = 0.85; utterance.rate = 0.70; }
                else if (isScared) { utterance.pitch = 1.3; utterance.rate = 1.10; }
                else if (isScream) { utterance.pitch = 1.6; utterance.rate = 1.30; }
                else if (isPain) { utterance.pitch = 0.4; utterance.rate = 0.60; }
                else if (isSad) { utterance.pitch = 0.3; utterance.rate = 0.55; }
                else if (isHappy) { utterance.pitch = 1.0; utterance.rate = 1.00; }
            }

            utterance.volume = 1.0;

            utterance.onend = () => {
                speakSequentialStory(storyArray, currentLineIndex + 1);
            };

            utterance.onerror = () => {
                speakSequentialStory(storyArray, currentLineIndex + 1);
            };

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        UX: function toggleVoiceEngine() {
            const btn = document.getElementById('voice-btn');
            isVoiceEnabled = !isVoiceEnabled;
            if (isVoiceEnabled) {
                btn.innerText = "VOICE: ON";
                btn.classList.remove('muted');
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                btn.innerText = "VOICE: OFF";
                btn.classList.add('muted');
                window.speechSynthesis.cancel();
            }
        }

        function spawnGhost() {
            const ghost = document.createElement('div');
            ghost.classList.add('bg-ghost');
            
            const ghostBody = document.createElement('div');
            ghostBody.classList.add('bg-ghost-body');
            ghostBody.innerHTML = '👻';
            ghost.appendChild(ghostBody);

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            ghost.style.left = startX + 'px';
            ghost.style.top = startY + 'px';

            const driftX = (Math.random() - 0.5) * 150;
            const driftY = (Math.random() - 0.5) * 150;
            ghost.style.setProperty('--x-drift', `${driftX}px`);
            ghost.style.setProperty('--y-drift', `${driftY}px`);

            const sizeRandom = 1.8 + Math.random() * 3; 
            ghost.style.fontSize = `${sizeRandom}rem`;

            const flipDirection = Math.random() > 0.5 ? 'scaleX(1)' : 'scaleX(-1)';
            ghostBody.style.setProperty('--base-flip', flipDirection);

            const randomRoll = Math.random();
            let targetOpacity = 0.06; 
            if (randomRoll > 0.85) {
                targetOpacity = 0.20; 
            } else if (randomRoll > 0.50) {
                targetOpacity = 0.12; 
            }
            ghost.style.setProperty('--target-opacity', targetOpacity);

            ghost.addEventListener('mousedown', function() {
                ghost.classList.add('fly-away');
                setTimeout(() => { ghost.remove(); }, 800);
            });
            ghost.addEventListener('touchstart', function() {
                ghost.classList.add('fly-away');
                setTimeout(() => { ghost.remove(); }, 800);
            });

            document.body.appendChild(ghost);

            setTimeout(() => {
                if (ghost.parentNode) ghost.remove();
            }, 10000);
        }

        function ghostLoop() {
            spawnGhost();
            const nextSpawnDelay = 2000 + Math.random() * 3000;
            setTimeout(ghostLoop, nextSpawnDelay);
        }

        window.onload = () => {
            const initialTitleArray = ["[T] Noan's Favorite Stories // Enter"];
            renderAnimatedText(initialTitleArray, false);
            ghostLoop();
        };
    </script>
</body>
</html>
