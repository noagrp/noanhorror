<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noan's Favorite Stories</title>
    <style>
        /* Base Pure Dark Atmosphere */
        body {
            background-color: #020204 !important;
            color: #ffffff !important;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* TWEAK LINE: Utilizes modern Dynamic Viewport Height to lock bounds flawlessly on mobile without ghost scrolling */
            min-height: 100dvh; 
            max-width: 100vw; /* Locks horizontal boundaries strictly to the device hardware */
            contain: paint;   /* Prevents floating entities from pulling or expanding the layout */
            display: flex;
            flex-direction: column; /* Clean vertical stacked grouping */
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            height: 100vh;
            height: 100dvh;
        }

        /* Fixed Audio Panel - Locked to Top Right Permanently */
        .audio-controls {
            position: fixed;
            top: 20px !important;
            right: 20px !important;
            bottom: auto !important;
            left: auto !important;
            z-index: 40; /* Placed above all layers to ensure unconditional touch priority */
            display: flex;
            gap: 15px;
        }

        /* High Visibility Redesigned Control Button Framework */
        .control-btn {
            background: rgba(239, 68, 68, 0.15) !important; /* Semi-transparent crimson backing glow */
            border: 1px solid #ef4444 !important; /* Crisp glowing red safety border line */
            outline: none !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3) !important; /* Atmospheric red drop glow */
            color: #ef4444 !important; /* Punchy high-visibility crimson red text */
            cursor: pointer;
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.3s ease-in-out;
            padding: 6px 14px; /* Enhanced interactive touch zone boundary */
            margin: 0;
            border-radius: 4px;
            -webkit-appearance: none;
            appearance: none;
        }
        .control-btn:hover {
            background: rgba(239, 68, 68, 0.3) !important;
            color: #ffffff !important;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.5) !important;
        }
        /* Muted High Contrast Visual Alert State (Prevents Button from going dim/invisible) */
        .control-btn.muted {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid #7f1d1d !important; /* Deep dark blood-red border line indicator */
            color: #ffffff !important; /* Swaps to crisp absolute solid white text for extreme night readability */
            box-shadow: 0 0 8px rgba(127, 29, 29, 0.4) !important;
        }

        /* Responsive Glassmorphism Story Box Container (No Border) */
        .card-container {
            position: relative;
            z-index: 5; 
            max-width: 550px;
            width: 85%;
            text-align: center;
            box-sizing: border-box;
            padding: 40px 30px;
            border-radius: 16px;
            transition: all 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Safe Height boundaries preventing viewport breakage on short devices */
            max-height: 80vh;
            max-height: 80dvh;
            
            /* Glassmorphism Effect Rules */
            background: rgba(255, 255, 255, 0.02) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            
            border: none !important;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8) !important;
        }

        /* Menu State: Forces perfect vertical/horizontal fullscreen centering for the Enter word */
        .card-container.is-menu-state {
            max-width: 100% !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-height: 100vh !important;
            max-height: 100dvh !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            padding: 0;
        }

        /* Full Word Shaking Structure Base */
        .word-shiver {
            display: inline-block;
            white-space: pre; 
            animation: wordTremble 0.22s infinite alternate ease-in-out;
        }

        @keyframes wordTremble {
            0% { transform: translate(0.4px, 0.2px) rotate(0deg); }
            50% { transform: translate(-0.2px, -0.3px) rotate(-0.1deg); }
            100% { transform: translate(0.3px, -0.2px) rotate(0.1deg); }
        }

        #story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            min-height: 140px;
            
            /* Dynamic height balancing for ultra short or cramped phone displays */
            max-height: 50vh; 
            max-height: 50dvh;
            overflow-y: auto; 
            scrollbar-width: none; /* Hides scrollbar for Firefox */
            width: 100%;
            display: block; 
            text-align: justify;
            text-justify: inter-word;
            color: #e5e7eb !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            margin: 0;
            padding: 0;
            transition: font-size 0.3s ease;
        }

        /* Hide scrollbars completely for Chrome, Safari, Opera */
        #story-text::-webkit-scrollbar {
            display: none;
        }

        /* Center alignments explicitly on the initial Menu view screen layout */
        #story-text.menu-centered {
            text-align: center !important;
            font-size: 2.5rem !important; /* Desktop Title Font Size */
            letter-spacing: 4px;
            color: #ffffff !important;
            max-height: none !important;
            overflow-y: visible !important;
        }

        /* Glassmorphic Action Button Configuration (No Border) */
        .next-btn {
            display: inline-block;
            margin-top: 35px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            padding: 12px 28px;
            border-radius: 8px;
            color: #ffffff !important;
            flex-shrink: 0; /* Prevents button from collapsing on tiny screens */
            
            background: rgba(153, 27, 27, 0.15) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: none !important; 
            outline: none !important;
            box-shadow: none !important;
            
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .next-btn:hover {
            background: rgba(239, 68, 68, 0.3) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2) !important;
        }

        /* Highly Recognizable Floating Background Ghosts */
        .bg-ghost {
            position: absolute;
            z-index: 1;
            cursor: pointer;
            filter: blur(2px);
            animation: floatAndFade 10s ease-in-out forwards;
        }

        /* Ghost Inner container element allows scale flipping over animation space paths */
        .bg-ghost-body {
            display: inline-block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
            transform: var(--base-flip);
        }

        @keyframes floatAndFade {
            0% { opacity: 0; transform: translate(0, 0) scale(0.7); }
            25% { opacity: var(--target-opacity); }
            75% { opacity: var(--target-opacity); }
            100% { opacity: 0; transform: translate(var(--x-drift), var(--y-drift)) scale(1.1); }
        }

        .bg-ghost.fly-away .bg-ghost-body {
            transform: translateY(-350px) scale(0.1) rotate(60deg) !important;
            opacity: 0 !important;
        }

        /* Centered Directly Above the Story Card Flow (Option 1) */
        .site-footer {
            max-width: 550px;
            width: 85%;
            text-align: center;
            z-index: 10;
            font-family: monospace;
            font-size: 0.65rem;
            color: transparent; /* Set to hidden initially during initial fullscreen title layout state */
            letter-spacing: 1px;
            line-height: 1.5;
            box-sizing: border-box;
            margin-bottom: 15px; /* Creates explicit breathing clearance buffer above the container card */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            transition: color 0.5s ease-in-out;
        }
        .site-footer.active-state {
            color: rgba(255, 255, 255, 0.55) !important; /* Transitions cleanly to a soft white on explicit application state entry */
        }

        /* Mobile and Landscape Short Screen Optimizations */
        @media (max-width: 580px), (max-height: 600px) {
            .audio-controls {
                top: 12px !important;
                right: 12px !important;
            }
            .control-btn {
                font-size: 0.68rem;
                padding: 4px 10px;
            }
            .site-footer {
                max-width: 90%;
                width: 90%;
                font-size: 0.55rem;
                line-height: 1.3;
                margin-bottom: 10px;
            }
            .card-container {
                padding: 25px 20px;
                width: 90%;
                max-height: 68vh;
                max-height: 68dvh;
                margin-bottom: 20px; 
            }
            .card-container.is-menu-state {
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-height: 100vh !important;
                max-height: 100dvh !important;
                margin-top: 0px;
                margin-bottom: 0px;
            }
            #story-text {
                font-size: 1.1rem;
                min-height: 120px;
                max-height: 38vh;
                max-height: 38dvh;
            }
            #story-text.menu-centered {
                font-size: 2.2rem !important; /* Mobile Title Font Size */
            }
            .next-btn {
                width: 100%;
                box-sizing: border-box;
                margin-top: 20px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="audio-controls">
        <button id="voice-btn" class="control-btn" onclick="toggleVoiceEngine()">VOICE: ON</button>
    </div>

    <!-- Atmospheric Disclaimer Header Row Node - Relocated right above the card container stack -->
    <header id="app-footer" class="site-footer">
        Disclaimer: All stories are fictional. For the best experience, read on a computer. You may need to Install Voice Data (download a high-quality or "Enhanced" voice pack) on a phone.
    </header>

    <!-- Main Glassmorphism Framework Interface Box (Starts in Fullscreen Centered Menu State) -->
    <div id="main-frame-box" class="card-container is-menu-state" style="cursor: pointer;" onclick="enterTheHorror()">
        <!-- Title & Story Container Element Node -->
        <div id="story-text" class="menu-centered">Enter</div>
        
        <!-- Action Button Element Node -->
        <button id="action-trigger" class="next-btn" style="display: none;" onclick="showRandomStory(event)">Read Another</button>
    </div>

    <script>
        // HOOK FOR FUTURE STORAGE: Group elements modularly in localized story sets
        const storySet1 = [
            [
                "[T-NORMAL] The floorboards of Blackwood Manor groaned beneath Ben's weight, bleeding out ancient dust into the freezing twilight air. He gripped his failing flashlight tightly, tracing the strange symbols carved directly into the rotten wood frames.",
                "[S-SLOW] slow creak... slow snap... slow creak...",
                "[T-NORMAL] This layout matches the blueprint exactly. The hidden ledger should be right behind the mantlepiece.",
                "[T-SCARED] The sound came from upstairs. A rhythmic dragging weight, scraping right above his skull. Ben stopped breathing, freezing in absolute paralysis as he turned his face slowly toward the ceiling.",
                "[T-SCARED] Is anyone up there? I... I told you, I brought the keys... just let me leave with the documents...",
                "[S-FAST] quick tak... quick tak... quick tak... stairs...",
                "[T-SCARED] Sharp footsteps echoed clearly now, coming down the spiral staircase. The shadows stretched impossibly long across the wallpaper. Suddenly, a wet, freezing hand locked firmly around Ben's ankle from under the steps.",
                "[T-SCREAM] Help...! Someone answer me...! Get off me...! Please, let me go...!",
                "[S-SHORT] quick shhhhiiiiiiwrrrrrrk...",
                "[T-NORMAL] Sharp claws tore into his calf muscle as he was dragged violently down into the pitch-black basement cavity.",
                "[T-SCREAM] Ah...! My leg...! It's cutting right through the bone! Stop... please...",
                "[T-NORMAL] The flashlight dropped, shattering completely on the floorboards. In the absolute dark, a lady's weeping laughter drifted close to his ear, signaling that the door behind him was locked forever."
            ],
            [
                "[T-NORMAL] The safehouse barriers were buckling under the weight of the decaying horde outside. Red emergency alarms painted the concrete bunker in rhythmic, blinding pulses of crimson light.",
                "[T-NORMAL] The structural integrity is holding at forty percent. We still have a window to broadcast the coordinates.",
                "[S-DEEP] slow thud... slow thud... crash...",
                "[T-SCARED] Outside, the distorted wails of a hundred monsters scraped against the blast shield. Ben noticed a dark liquid oozing through the upper ventilator grille.",
                "[T-SCARED] Wait... what is that smell? That's not fuel oil... that's rot. How did they get up to the ventilation line?",
                "[S-SLOW] slow bzzzzzzt... slow pop... bzzzz...",
                "[T-SCARED] The overhead lights flickered once, twice, and then completely died. The mechanical locks on the main vault doors clicked open with a heavy pneumatic sigh.",
                "[T-SCARED] No.., no.., no..! The relay grid is fried! Lock it down manually! Get back from the threshold!",
                "[S-ENERGETIC] quick growl... quick crunch... quick tear...",
                "[T-SCREAM] They are breaking through! Grace, hit the self destruct switch! Help me...!",
                "[T-SCREAM] No... no... they are ripping my shoulder apart... everything is burning...",
                "[T-NORMAL] The sound of tearing metal erupted in the dark, followed immediately by heavy, shambling footsteps pouring inside. Ben felt cold teeth scrape across his neck as the transmission went permanently silent."
            ],
            [
                "[T-SCARED] Rain lashed violently against the glass window panes of the cabin where Ben stood trembling, holding a blood-slicked kitchen knife over the chest of the silent intruder.",
                "[S-SLOW] slow drip... slow drop... slow drip...",
                "[T-NORMAL] It is completely over now. The perimeter is quiet. No one is coming down this road in a storm like this.",
                "[T-NORMAL] He looked down at the pale face on the floor. The town police had spent weeks hunting for the serial killer stalking the local valley, warning everyone to lock their windows securely.",
                "[T-SCARED] I had no choice... he broke through the back entrance... he was going to kill me, right? I survived...",
                "[S-SLOW] slow tick... slow tock... slow tick...",
                "[T-SCARED] Ben stepped back to catch his breath, caught by his own image reflection in the wall mirror. He looked at the intricately carved wooden frame, then down at the victim. The victim's hands were bound completely with thick ropes from behind before the stabbing began.",
                "[T-SCARED] Wait... if he was the intruder... why did I find the ropes in my own drawer? Why did I lock him in?",
                "[S-FAST] quick hahahaha... quick hahahaha...",
                "[T-NORMAL] He wiped the blood from his own cheek, realizing the truth as his mind fractured completely. There was no break-in. Ben stared down at his reflection's hollow, unblinking eyes, realizing he was the monster the town had been praying to catch."
            ],
            [
                "[T-HAPPY] The morning sun pierced beautifully through the alpine canopy, casting golden beams over the clearing. Ben checked his radio, a massive grin breaking across his face as the signal meter jumped to full strength.",
                "[T-HAPPY] Yes...! The connection went through! The search team just cleared the northern ridge! We are finally going home!",
                "[S-SHORT] slow pop... slow bzzzz... click...",
                "[T-NORMAL] He turned around to share the joyful news with his survival partner, but his foot caught on a jagged copper snare hidden beneath the fallen leaves. The steel jaws snapped shut with terrifying velocity.",
                "[S-FAST] quick snap... quick crunch...",
                "[T-SCREAM] Ahhh...! My ankle! It's clamped clean through! The steel is biting into the nerve... I can't move!",
                "[T-NORMAL] He dragged his bleeding limb toward the edge of the ravine, desperately searching for the supply pack containing the medical splints. He looked over the ridge, only to see their entire equipment crate smashed to splinters at the bottom of the rocky canyon.",
                "[T-SCREAM] No... everything is gone. The medical kit, the supplies, the clean water... it's all destroyed. We survived two weeks out here just to bleed out on the final day...",
                "[S-DEEP] slow thud... slow thud... thud...",
                "[T-SCARED] Shadows detached themselves from the deeper thicket as the smell of fresh blood drifted into the wilderness. Ben looked up, his voice cracking into absolute desperation.",
                "[T-SCREAM] I'm over here...! Please...! Follow the signal! Help me before they close the gap...!"
            ],
            [
                "[T-NORMAL] My phone buzzed in the middle of the night with a security alert from the nursery camera.",
                "[S-SLOW] slow bzzzzzzt... slow pop...",
                "[T-SCARED] The video feed showed a tall, gaunt figure draped in black standing directly over my infant son's crib.",
                "[T-SCREAM] I sprinted down the hallway, bursting through the door with my flashlight raised.",
                "[T-NORMAL] The crib was completely empty, save for my phone lying face-up on the mattress, still streaming the live video of the figure standing right behind me."
    	    ],
            [
                "[T-NORMAL] The dentist told me the phantom pain in my jaw was just a localized nerve recovery delay.",
                "[S-DEEP] slow thud... slow crunch...",
                "[T-SCARED] But late at night, I can distinctly feel something blunt scraping against the backside of my teeth from inside the bone.",
                "[T-SCREAM] I clamped my mirror close and pried my mouth open, gasping as a tiny, human fingernail pushed its way through my gums.",
                "[T-NORMAL] It tapped twice against the glass before sliding back down into the dark muscle."
           ],
           [
                "[T-HAPPY] We smiled for the group photo, celebrating the final night of our isolated mountain trek.",
                "[S-SHORT] click... slow pop...",
                "[T-NORMAL] The flash illuminated the dark tree line behind us for a fraction of a second.",
                "[T-SCARED] When I looked at the digital preview, there weren't five faces in the frame anymore.",
                "[T-SCREAM] Something pale was wearing my friend's jacket, and the real version of him was hanging upside down from the branches above."
           ]
        ];

        // Combine future arrays here dynamically
        const ghostStories = [...storySet1];

        let unreadStories = [];
        let isVoiceEnabled = true;
        let hasEntered = false;
        
        let audioCtx = null;

        function renderAnimatedText(targetStoryArray, alignJustify = false) {
            const container = document.getElementById('story-text');
            container.innerHTML = ""; 
            
            if (alignJustify) {
                container.classList.remove('menu-centered');
            } else {
                container.classList.add('menu-centered');
            }

            targetStoryArray.forEach((rawLine, pIndex) => {
                // Strip out operational audio structural tags gracefully
                const displayLine = rawLine.replace(/^\[[A-Z\-]+\]\s*/, '');
                
                const pElement = document.createElement('p');
                pElement.style.margin = "0 0 1.5rem 0"; 
                if (pIndex === targetStoryArray.length - 1) pElement.style.margin = "0"; 
                
                const words = displayLine.split(' ');

                words.forEach((word, index) => {
                    const wordSpan = document.createElement('span');
                    wordSpan.textContent = word;
                    wordSpan.classList.add('word-shiver');
                    wordSpan.style.animationDelay = `${Math.random() * 0.4}s`;
                    pElement.appendChild(wordSpan);

                    if (index < words.length - 1) {
                        const space = document.createTextNode(" ");
                        pElement.appendChild(space);
                    }
                });

                container.appendChild(pElement);
            });
            
            container.scrollTop = 0;
        }

        function enterTheHorror() {
            if (hasEntered) return;
            hasEntered = true;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const mainBox = document.getElementById('main-frame-box');
            mainBox.style.cursor = "default";
            mainBox.removeAttribute('onclick');
            
            mainBox.classList.remove('is-menu-state');
            
            document.getElementById('app-footer').classList.add('active-state');
            
            document.getElementById('action-trigger').style.display = "inline-block";
            showRandomStory();
        }

        function showRandomStory(event) {
            if (event) event.stopPropagation();

            window.speechSynthesis.cancel();
            
            const actionBtn = document.getElementById('action-trigger');

            if (unreadStories.length === 0) {
                unreadStories = [...ghostStories]; 
                actionBtn.innerText = "Read Another";
            }

            const randomIndex = Math.floor(Math.random() * unreadStories.length);
            const chosenStoryArray = unreadStories.splice(randomIndex, 1)[0];

            renderAnimatedText(chosenStoryArray, true);
            
            if (unreadStories.length === 0) {
                actionBtn.innerText = "Read";
            }
            
            if (isVoiceEnabled) {
                speakSequentialStory(chosenStoryArray, 0);
            }
        }

        function playMidiSoundEffect(sfxTag, sfxText, callback) {
            if (!isVoiceEnabled || !audioCtx) {
                if (callback) callback();
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const tag = sfxTag.toLowerCase();
            const normalizedText = sfxText.toLowerCase();
            
            // DYNAMIC SFX EMOTION OVERRIDES FOR SYNTH TEMPO
            let beatDuration = 0.35; // default baseline interval
            let frequencyModifier = 0;

            if (tag.includes('fast') || tag.includes('energetic')) {
                beatDuration = 0.13; // Packed high-speed tempo
            } else if (tag.includes('slow') || tag.includes('long')) {
                beatDuration = 0.65; // Extended tracking tempo
            } else if (tag.includes('short')) {
                beatDuration = 0.20; // Short burst tracking tempo
            }

            if (tag.includes('deep')) {
                frequencyModifier = -35; // Drop pitches significantly for bass tones
            } else if (tag.includes('energetic')) {
                frequencyModifier = 40; // Shift pitches up for active profiles
            }

            const cleaned = normalizedText.replace(/[^a-z. ]/g, '');
            const beats = cleaned.split(/\s+|\.\.\.+/).filter(b => b.trim().length > 0);
            
            let startTime = audioCtx.currentTime + 0.05;

            beats.forEach((beat) => {
                if (beat === 'quick' || beat === 'slow') return;

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                let frequency = 90 + frequencyModifier; 
                let type = 'square'; 
                let duration = 0.15;

                if (beat.includes('tak') || beat.includes('tick') || beat.includes('tock') || beat.includes('snap')) {
                    frequency = beat.includes('tick') ? (180 + frequencyModifier) : (110 + frequencyModifier);
                    type = 'square';
                    duration = 0.04; 
                } else if (beat.includes('creak') || beat.includes('shhh') || beat.includes('shwrrk')) {
                    frequency = 75 + frequencyModifier;
                    type = 'sawtooth';
                    duration = 0.3; 
                } else if (beat.includes('thud') || beat.includes('crash') || beat.includes('growl') || beat.includes('crunch') || beat.includes('tear')) {
                    frequency = 55 + frequencyModifier; 
                    type = 'sawtooth';
                    duration = 0.25;
                } else if (beat.includes('bzzz') || beat.includes('pop')) {
                    frequency = 130 + frequencyModifier;
                    type = 'triangle';
                    duration = 0.2;
                } else if (beat.includes('hahaha')) {
                    frequency = 65 + frequencyModifier;
                    type = 'sawtooth';
                    duration = 0.12;
                }

                osc.type = type;
                osc.frequency.setValueAtTime(Math.max(20, frequency), startTime);
                
                if (type === 'sawtooth') {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, frequency - 20), startTime + duration);
                }

                gainNode.gain.setValueAtTime(0.12, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                osc.start(startTime);
                osc.stop(startTime + duration);

                startTime += beatDuration;
            });

            const totalDurationMs = ((startTime - audioCtx.currentTime) * 1000) + 100;
            setTimeout(() => {
                if (callback) callback();
            }, totalDurationMs);
        }

        function speakSequentialStory(storyArray, currentLineIndex) {
            if (!isVoiceEnabled || currentLineIndex >= storyArray.length) return;

            const rawLine = storyArray[currentLineIndex];
            
            // Check for explicit structural tags
            const hasTag = rawLine.startsWith("[") && rawLine.includes("]");
            
            // If the story line is totally clean, handle as neutral text with standard continuation
            if (!hasTag) {
                const utterance = new SpeechSynthesisUtterance(rawLine);
                utterance.pitch = 0.85;
                utterance.rate = 0.80;
                utterance.onend = () => speakSequentialStory(storyArray, currentLineIndex + 1);
                utterance.onerror = () => speakSequentialStory(storyArray, currentLineIndex + 1);
                window.speechSynthesis.speak(utterance);
                return;
            }

            const tagEndIndex = rawLine.indexOf("]");
            const completeTag = rawLine.substring(1, tagEndIndex);
            const cleanText = rawLine.substring(tagEndIndex + 1).trim();

            // Intercept synthesizer sounds directly
            if (completeTag.startsWith("S-")) {
                playMidiSoundEffect(completeTag, cleanText, () => {
                    speakSequentialStory(storyArray, currentLineIndex + 1);
                });
                return;
            }

            // Route Storyteller audio options
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            // Apply single narrator dynamic voice modulation rules across mobile boundaries
            if (completeTag.includes("HAPPY")) {
                utterance.pitch = 1.05; 
                utterance.rate = 0.95;  
            } else if (completeTag.includes("SCREAM")) {
                utterance.pitch = 1.35; 
                utterance.rate = 1.20;  
            } else if (completeTag.includes("SCARED") || completeTag.includes("SAD")) {
                utterance.pitch = 0.60; // Same lower/flattened emotional profile
                utterance.rate = 0.70;  
            } else { 
                // Default fallback / NORMAL state profile
                utterance.pitch = 0.85;
                utterance.rate = 0.80;
            }

            utterance.volume = 1.0;

            utterance.onend = () => {
                speakSequentialStory(storyArray, currentLineIndex + 1);
            };

            utterance.onerror = () => {
                speakSequentialStory(storyArray, currentLineIndex + 1);
            };

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function toggleVoiceEngine() {
            const btn = document.getElementById('voice-btn');
            isVoiceEnabled = !isVoiceEnabled;
            if (isVoiceEnabled) {
                btn.innerText = "VOICE: ON";
                btn.classList.remove('muted');
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                btn.innerText = "VOICE: OFF";
                btn.classList.add('muted');
                window.speechSynthesis.cancel();
            }
        }

        function spawnGhost() {
            const ghost = document.createElement('div');
            ghost.classList.add('bg-ghost');
            
            const ghostBody = document.createElement('div');
            ghostBody.classList.add('bg-ghost-body');
            ghostBody.innerHTML = '👻';
            ghost.appendChild(ghostBody);

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            ghost.style.left = startX + 'px';
            ghost.style.top = startY + 'px';

            const driftX = (Math.random() - 0.5) * 150;
            const driftY = (Math.random() - 0.5) * 150;
            ghost.style.setProperty('--x-drift', `${driftX}px`);
            ghost.style.setProperty('--y-drift', `${driftY}px`);

            const sizeRandom = 1.8 + Math.random() * 3; 
            ghost.style.fontSize = `${sizeRandom}rem`;

            const flipDirection = Math.random() > 0.5 ? 'scaleX(1)' : 'scaleX(-1)';
            ghostBody.style.setProperty('--base-flip', flipDirection);

            const randomRoll = Math.random();
            let targetOpacity = 0.06; 
            if (randomRoll > 0.85) {
                targetOpacity = 0.20; 
            } else if (randomRoll > 0.50) {
                targetOpacity = 0.12; 
            }
            ghost.style.setProperty('--target-opacity', targetOpacity);

            ghost.addEventListener('mousedown', function() {
                ghost.classList.add('fly-away');
                setTimeout(() => { ghost.remove(); }, 800);
            });
            ghost.addEventListener('touchstart', function() {
                ghost.classList.add('fly-away');
                setTimeout(() => { ghost.remove(); }, 800);
            });

            document.body.appendChild(ghost);

            setTimeout(() => {
                if (ghost.parentNode) ghost.remove();
            }, 10000);
        }

        function ghostLoop() {
            spawnGhost();
            const nextSpawnDelay = 2000 + Math.random() * 3000;
            setTimeout(ghostLoop, nextSpawnDelay);
        }

        window.onload = () => {
            const initialTitleArray = ["Enter"];
            renderAnimatedText(initialTitleArray, false);
            ghostLoop();
        };
    </script>
</body>
</html>
